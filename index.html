<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Голод. Нетолстый роман — Светлана Олеговна Павлова</title>
<style>
:root{
  --bg: #14171a;
  --panel: #1c2024;
  --panel-line: #2b3136;
  --ink: #e7e3d8;
  --ink-dim: #a9ada6;
  --muted: #74797f;
  --accent: #8fb3c9;
  --accent-ink: #10161a;
  --accent-soft: rgba(143,179,201,0.14);
  --serif: Georgia, "Times New Roman", "Noto Serif", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
}

/* ---- fixed title, always visible top-left ---- */
.site-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 30;
  padding: 16px 20px 22px 20px;
  background: linear-gradient(180deg, rgba(20,23,26,0.97) 55%, rgba(20,23,26,0));
  pointer-events: none;
}
.site-header .author {
  font-family: var(--sans);
  font-size: 12.5px;
  letter-spacing: 0.03em;
  color: var(--ink-dim);
  margin: 0;
  pointer-events: auto;
}
.site-header .book-title {
  font-family: var(--serif);
  font-style: italic;
  font-size: 16px;
  color: var(--accent);
  margin: 3px 0 0 0;
  pointer-events: auto;
}

.header-spacer { height: 78px; }

/* ---- table of contents ---- */
.toc-view {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 0 24px 64px 24px;
}
.toc-inner {
  max-width: 760px;
  width: 100%;
}
.toc-heading {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 22px;
  color: var(--ink-dim);
  margin: 8px 0 28px 0;
}
.toc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
}
.toc-item {
  background: var(--panel);
  border: 1px solid var(--panel-line);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14.5px;
  padding: 14px 10px;
  border-radius: 6px;
  cursor: pointer;
  text-align: center;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
.toc-item:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
}
.toc-item.has-text {
  color: var(--accent);
}

/* ---- reader layout ---- */
.reader-view { display: none; }
.page {
  display: grid;
  grid-template-columns: 1fr 400px;
  min-height: 100vh;
}
@media (max-width: 860px) {
  .page { grid-template-columns: 1fr; }
  .list-panel { border-left: none; border-top: 1px solid var(--panel-line); }
}

.read-panel {
  padding: 96px 48px 64px 56px;
  display: flex;
  justify-content: center;
}
.read-inner {
  max-width: 780px;
  width: 100%;
}
.back-link {
  display: inline-block;
  font-family: var(--sans);
  font-size: 13px;
  color: var(--muted);
  cursor: pointer;
  margin: 0 0 18px 0;
  background: none;
  border: none;
  padding: 0;
}
.back-link:hover { color: var(--accent); }
.eyebrow {
  color: var(--muted);
  font-size: 13px;
  letter-spacing: 0.02em;
  margin: 0 0 6px 0;
}
.heading {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 22px;
  color: var(--ink-dim);
  margin: 0 0 32px 0;
}
.text {
  font-family: var(--serif);
  font-size: 22px;
  line-height: 1.85;
  color: var(--ink);
  margin: 0;
  text-indent: 2em;
}
.word {
  cursor: pointer;
  border-radius: 3px;
  padding: 1px 2px;
  margin: 0 -2px;
  transition: background-color 0.15s ease, color 0.15s ease;
}
.word:hover { background: var(--accent-soft); }
.word.active { background: var(--accent); color: var(--accent-ink); }

/* ---- audio player ---- */
.player-spacer { height: 92px; }
.audio-player {
  position: fixed;
  left: 0;
  bottom: 0;
  width: calc(100% - 400px);
  background: rgba(20, 23, 26, 0.92);
  backdrop-filter: blur(6px);
  border-top: 1px solid var(--panel-line);
  padding: 16px 48px 16px 56px;
  display: flex;
  align-items: center;
  gap: 16px;
  z-index: 10;
}
.audio-player { width: calc(100% - 400px); }
@media (max-width: 860px) {
  .audio-player { width: 100%; padding: 14px 20px; }
}
.player-title {
  font-family: var(--sans);
  font-size: 12.5px;
  color: var(--muted);
  white-space: nowrap;
  margin: 0 4px 0 0;
  min-width: 64px;
}
.player-btn {
  background: var(--accent);
  color: var(--accent-ink);
  border: none;
  width: 38px;
  height: 38px;
  min-width: 38px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  padding: 0;
}
.player-btn:hover { opacity: 0.88; }
.player-skip {
  background: none;
  border: none;
  color: var(--ink-dim);
  width: 34px;
  height: 34px;
  min-width: 34px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-family: var(--sans);
  padding: 0;
  line-height: 1.1;
}
.player-skip:hover { color: var(--ink); background: var(--panel-line); }
.player-time {
  font-family: var(--sans);
  font-size: 12px;
  color: var(--ink-dim);
  min-width: 38px;
  text-align: center;
  white-space: nowrap;
}
.player-track {
  position: relative;
  flex: 1;
  height: 20px;
  display: flex;
  align-items: center;
  cursor: pointer;
}
.player-track-bg {
  position: relative;
  width: 100%;
  height: 4px;
  background: var(--panel-line);
  border-radius: 2px;
  overflow: visible;
}
.player-track-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 0%;
  background: var(--accent);
  border-radius: 2px;
}
.player-track-head {
  position: absolute;
  top: 50%;
  left: 0%;
  width: 2px;
  height: 16px;
  background: var(--ink);
  transform: translate(-1px, -50%);
  border-radius: 1px;
  pointer-events: none;
}

/* ---- right: word list panel ---- */
.list-panel {
  background: var(--panel);
  border-left: 1px solid var(--panel-line);
  padding: 96px 32px 48px 32px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.list-title {
  font-family: var(--sans);
  font-size: 15px;
  color: var(--ink);
  margin: 0 0 4px 0;
}
.list-count {
  font-family: var(--sans);
  font-size: 13px;
  color: var(--muted);
  margin: 0 0 28px 0;
}
.empty {
  font-family: var(--sans);
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--muted);
  max-width: 240px;
}
.entries-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}
.entries-table col.col-ru { width: 42%; }
.entries-table col.col-hu { width: 48%; }
.entries-table col.col-remove { width: 10%; }
.entries-table td {
  padding: 14px 8px;
  border-bottom: 1px solid var(--panel-line);
  vertical-align: top;
}
.entries-table tr:last-child td { border-bottom: none; }
.entry-ru {
  font-family: var(--sans);
  font-size: 17px;
  color: var(--accent);
  margin: 0 0 6px 0;
  word-wrap: break-word;
}
.entry-aspect {
  font-family: var(--sans);
  font-size: 12px;
  color: var(--ink-dim);
  line-height: 1.5;
  margin: 0;
  white-space: pre-line;
}
.entry-hu {
  font-family: var(--sans);
  font-size: 14.5px;
  color: var(--ink);
  margin: 0;
  line-height: 1.5;
  word-wrap: break-word;
}
.entry-remove {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 17px;
  line-height: 1;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 3px;
}
.entry-remove:hover { color: var(--ink); background: var(--panel-line); }
</style>
</head>
<body>

<div class="site-header">
  <p class="author">Светлана Олеговна Павлова</p>
  <p class="book-title">Голод. Нетолстый роман</p>
</div>

<!-- ================= TARTALOMJEGYZÉK (kezdőlap) ================= -->
<div class="toc-view" id="tocView">
  <div class="header-spacer"></div>
  <div class="toc-inner">
    <p class="eyebrow">Tartalomjegyzék</p>
    <h1 class="toc-heading">Válassz egy részt az olvasáshoz</h1>
    <div class="toc-grid" id="tocGrid"></div>
  </div>
</div>

<!-- ================= OLVASÓ NÉZET ================= -->
<div class="reader-view" id="readerView">
  <div class="page">
    <div class="read-panel">
      <div class="read-inner">
        <button class="back-link" id="backBtn">← Tartalomjegyzék</button>
        <p class="eyebrow" id="chapterEyebrow">Olvasógyakorlat</p>
        <h1 class="heading">Kattints egy szóra a szótári alakért</h1>
        <div id="text"></div>
        <div class="player-spacer"></div>
      </div>
    </div>

    <div class="list-panel">
      <p class="list-title">Szólista</p>
      <p class="list-count" id="count">0 szó kiválasztva</p>
      <div id="listArea">
        <p class="empty" id="emptyMsg">Még nincs kiválasztott szó. Kattints a szövegben bármelyik szóra.</p>
        <table class="entries-table">
          <colgroup>
            <col class="col-ru"><col class="col-hu"><col class="col-remove">
          </colgroup>
          <tbody id="entries"></tbody>
        </table>
      </div>
    </div>
  </div>

  <audio id="chapterAudio" preload="metadata"></audio>
  <div class="audio-player">
    <p class="player-title" id="playerTitle">1. rész</p>
    <button class="player-skip" id="skipBackBtn" aria-label="10 másodperc vissza">−10</button>
    <button class="player-btn" id="playBtn" aria-label="Lejátszás">▶</button>
    <button class="player-skip" id="skipFwdBtn" aria-label="10 másodperc előre">+10</button>
    <span class="player-time" id="currentTime">0:00</span>
    <div class="player-track" id="playerTrack">
      <div class="player-track-bg">
        <div class="player-track-fill" id="trackFill"></div>
        <div class="player-track-head" id="trackHead"></div>
      </div>
    </div>
    <span class="player-time" id="durationTime">0:00</span>
  </div>
</div>

const tocView = document.getElementById('tocView');
const readerView = document.getElementById('readerView');
const backBtn = document.getElementById('backBtn');
const chapterEyebrow = document.getElementById('chapterEyebrow');
const textContainer = document.getElementById('text');
const playerTitleEl = document.getElementById('playerTitle');

backBtn.addEventListener('click', () => {
  audio.pause();
  readerView.style.display = 'none';
  tocView.style.display = 'flex';
  window.scrollTo(0, 0);
});

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function wrapParagraph(text) {
  const re = /[А-Яа-яЁёA-Za-z0-9]+(?:-[А-Яа-яЁёA-Za-z0-9]+)*/g;
  let result = '';
  let lastIndex = 0;
  let m;
  while ((m = re.exec(text)) !== null) {
    result += escapeHtml(text.slice(lastIndex, m.index));
    const word = m[0];
    const key = word.toLowerCase();
    result += '<span class="word" data-key="' + key + '">' + escapeHtml(word) + '</span>';
    lastIndex = m.index + word.length;
  }
  result += escapeHtml(text.slice(lastIndex));
  return result;
}

function openChapter(id) {
  const ch = chapters.find(c => c.id === id);
  if (!ch) return;

  chapterEyebrow.textContent = ch.title;

  if (ch.paragraphs) {
    textContainer.innerHTML = ch.paragraphs
      .map(p => '<p class="text">' + wrapParagraph(p) + '</p>')
      .join('');
  } else {
    textContainer.innerHTML =
      '<p class="text" style="text-indent:0; color: var(--muted); font-family: var(--sans); font-size: 15px;">' +
      'Ehhez a részhez még nincs feltöltve szöveg.</p>';
  }

  document.querySelectorAll('.word').forEach(span => {
    span.addEventListener('click', () => toggleWord(span.getAttribute('data-key')));
  });
  render();

  audio.pause();
  audio.src = ch.audio;
  audio.currentTime = 0;
  playerTitleEl.textContent = ch.title;
  trackFill.style.width = '0%';
  trackHead.style.left = '0%';
  currentTimeEl.textContent = '0:00';
  durationTimeEl.textContent = '0:00';

  tocView.style.display = 'none';
  readerView.style.display = 'block';
  window.scrollTo(0, 0);
}

  if (selected.size === 0) {
    emptyMsg.style.display = 'block';
  } else {
    emptyMsg.style.display = 'none';
    selected.forEach(key => {
      const d = dict[key];
      if (!d) return;
      const row = document.createElement('tr');

      const ruCell = document.createElement('td');
      if (d.aspect) {
        const impfP = document.createElement('p');
        impfP.className = 'entry-ru';
        impfP.textContent = d.aspect.impf;
        const perfP = document.createElement('p');
        perfP.className = 'entry-ru';
        perfP.textContent = d.aspect.perf;
        ruCell.appendChild(impfP);
        ruCell.appendChild(perfP);
      } else {
        const ru = document.createElement('p');
        ru.className = 'entry-ru';
        ru.textContent = d.lemma || key;
        ruCell.appendChild(ru);
      }

      const huCell = document.createElement('td');
      const hu = document.createElement('p');
      hu.className = 'entry-hu';
      hu.textContent = d.hu;
      huCell.appendChild(hu);

      const removeCell = document.createElement('td');
      const removeBtn = document.createElement('button');
      removeBtn.className = 'entry-remove';
      removeBtn.textContent = '×';
      removeBtn.setAttribute('aria-label', 'Eltávolítás a listából');
      removeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleWord(key);
      });
      removeCell.appendChild(removeBtn);

      row.appendChild(ruCell);
      row.appendChild(huCell);
      row.appendChild(removeCell);
      entriesEl.appendChild(row);
    });
  }
  countEl.textContent = selected.size + (selected.size === 1 ? ' szó kiválasztva' : ' szó kiválasztva');
  document.querySelectorAll('.word').forEach(span => {
    const key = span.getAttribute('data-key');
    span.classList.toggle('active', selected.has(key));
  });
}

function toggleWord(key) {
  if (!dict[key]) return;
  if (selected.has(key)) selected.delete(key);
  else selected.add(key);
  render();
}

/* =========================================================
   AUDIO LEJÁTSZÓ
   ========================================================= */
const audio = document.getElementById('chapterAudio');
const playBtn = document.getElementById('playBtn');
const currentTimeEl = document.getElementById('currentTime');
const durationTimeEl = document.getElementById('durationTime');
const trackFill = document.getElementById('trackFill');
const trackHead = document.getElementById('trackHead');
const playerTrack = document.getElementById('playerTrack');

function formatTime(sec) {
  if (!isFinite(sec) || isNaN(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function updateProgress() {
  const dur = audio.duration || 0;
  const pct = dur ? (audio.currentTime / dur) * 100 : 0;
  trackFill.style.width = pct + '%';
  trackHead.style.left = pct + '%';
  currentTimeEl.textContent = formatTime(audio.currentTime);
}

audio.addEventListener('loadedmetadata', () => {
  durationTimeEl.textContent = formatTime(audio.duration);
});
audio.addEventListener('timeupdate', updateProgress);
audio.addEventListener('play', () => { playBtn.textContent = '⏸'; });
audio.addEventListener('pause', () => { playBtn.textContent = '▶'; });
audio.addEventListener('ended', () => { playBtn.textContent = '▶'; });

playBtn.addEventListener('click', () => {
  if (audio.paused) audio.play().catch(() => {});
  else audio.pause();
});

document.getElementById('skipBackBtn').addEventListener('click', () => {
  audio.currentTime = Math.max(0, audio.currentTime - 10);
  updateProgress();
});
document.getElementById('skipFwdBtn').addEventListener('click', () => {
  const dur = isFinite(audio.duration) ? audio.duration : audio.currentTime + 10;
  audio.currentTime = Math.min(dur, audio.currentTime + 10);
  updateProgress();
});

function seekFromEvent(e) {
  const rect = playerTrack.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  let pct = (clientX - rect.left) / rect.width;
  pct = Math.min(1, Math.max(0, pct));
  if (isFinite(audio.duration) && audio.duration > 0) {
    audio.currentTime = pct * audio.duration;
    updateProgress();
  }
}
let isSeeking = false;
playerTrack.addEventListener('mousedown', (e) => { isSeeking = true; seekFromEvent(e); });
window.addEventListener('mousemove', (e) => { if (isSeeking) seekFromEvent(e); });
window.addEventListener('mouseup', () => { isSeeking = false; });
playerTrack.addEventListener('touchstart', (e) => { isSeeking = true; seekFromEvent(e); });
window.addEventListener('touchmove', (e) => { if (isSeeking) seekFromEvent(e); });
window.addEventListener('touchend', () => { isSeeking = false; });
</script>
